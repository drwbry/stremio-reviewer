name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Test
        run: python -m pytest
      - name: Enforce critical-module coverage
        run: |
          coverage report --include='src/stremioctl/privacy.py' --fail-under=90
          coverage report --include='src/stremioctl/diff.py,src/stremioctl/plans.py' --fail-under=90
          coverage report --include='src/stremioctl/account.py' --fail-under=90
          coverage report --include='src/stremioctl/apply.py' --fail-under=90
          coverage report --include='src/stremioctl/aiostreams.py' --fail-under=90
      - name: Lint and type-check
        run: |
          ruff check .
          mypy src
      - name: Build distributions
        run: python -m build
      - name: Verify wheel schemas
        run: |
          python -m venv /tmp/stremioctl-wheel-test
          /tmp/stremioctl-wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/stremioctl-wheel-test/bin/python -c "from stremioctl.schemas import load_schema; load_schema('change-plan-v1'); load_schema('aiostreams-backup-v1')"
