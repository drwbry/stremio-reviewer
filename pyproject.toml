[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "stremioctl"
version = "0.2.0"
description = "A safe, deterministic CLI for managing Stremio add-on collections"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "jsonschema>=4.23,<5",
    "platformdirs>=4,<5",
    "rich>=13,<15",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
]

[project.scripts]
stremioctl = "stremioctl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stremioctl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "--strict-markers --cov=stremioctl --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["src/stremioctl"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
pretty = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# jsonschema does not ship inline types or a bundled stub package.
module = "jsonschema.*"
ignore_missing_imports = true
